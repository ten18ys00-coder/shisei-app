<script>
{

function rot_(v,x,y,sg){const a=sg*(v.roll||0)/D;if(!a)return {x,y};const cx=v.ar/2,cy=0.5,dx=x-cx,dy=y-cy,c=Math.cos(a),s=Math.sin(a);return {x:cx+dx*c-dy*s,y:cy+dx*s+dy*c}}

function pt(v,i){const l=v.lm[i];if(!l||l[3]<0.35||l[0]<-0.02||l[0]>1.02||l[1]<-0.02||l[1]>1.02)return null;return cor(v,l[0]*v.ar,l[1])}

const mid=(a,b)=>a&&b?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:null;
const tilt=(r,l)=>r&&l?Math.atan2(l.y-r.y,l.x-r.x)*D:null;
const vang=(lo,hi,s=1)=>lo&&hi?Math.atan2((hi.x-lo.x)*s,lo.y-hi.y)*D:null;
function kneeDev(h,k,a,lat){if(!h||!k||!a)return null;const t=(k.y-h.y)/((a.y-h.y)||1e-6);const lx=h.x+(a.x-h.x)*t;const L=Math.hypot(a.x-h.x,a.y-h.y)/2;return Math.atan2((k.x-lx)*lat,L)*D*2}
function frontM(v,hcm){

 const sM=mid(lS,rS),hM=mid(lH,rH),aM=mid(lA,rA),eM=mid(lE,rE);

 const m={headTilt:tilt(rE,lE)};if(m.headTilt==null)m.headTilt=tilt(pt(v,5),pt(v,2));
 m.shoulderTilt=tilt(rS,lS);m.pelvisTilt=tilt(rH,lH);m.trunkLean=vang(hM,sM);m.bodyShift=vang(aM,nose||eM);
 const kl=kneeDev(lH,lK,lA,1),kr=kneeDev(rH,rK,rA,-1);m.kneeAlign=kl!=null&&kr!=null?(kl+kr)/2:(kl!=null?kl:kr);
 const ex={};

 if(lE&&rE&&nose){const r=(nose.x-(lE.x+rE.x)/2)/((Math.abs(lE.x-rE.x)/2)||1e-6);rot.headRot=Math.atan(r*0.75)*D}

 if(w){const wr=(a,b)=>Math.atan2(w[b][2]-w[a][2],w[a][0]-w[b][0])*D;if(vis(11)&&vis(12))rot.shoulderRot=wr(11,12);if(vis(23)&&vis(24))rot.pelvisRot=wr(23,24);if(rot.shoulderRot!=null&&rot.pelvisRot!=null)rot.twist=rot.shoulderRot-rot.pelvisRot}

function sideM(v,hcm,k){

function score(v,s){const a=Math.abs(v);if(a<=s.good)return 100-10*a/s.good;if(a<=s.bad)return 90-30*(a-s.good)/(s.bad-s.good);return Math.max(30,60-30*(a-s.bad)/s.bad)}

function analyze(c){
 const rows=[];const add=(key,vk,val,extra)=>{if(val==null||!isFinite(val))return;const s=SPEC[key],q=specOf(key),d=val-q.ofs;rows.push({key,vk,val:d,raw:val,extra:extra||'',score:score(d,q),st:stOf(d,q),label:s.label,dir:s.dir(d),g:s.g})};
 let F=null;const SD={};
 if(c.views.front){F=frontM(c.views.front,c.height);FRONT_KEYS.forEach(k=>add(k,'front',F.m[k],F.ex[k]));ROT_KEYS.forEach(k=>add(k,'rot',F.rot[k]))}
 ['right','left'].forEach(k=>{if(c.views[k]){const r=sideM(c.views[k],c.height,k);SD[k]=r;SIDE_KEYS.forEach(q=>add(q,k,r.m[q],r.ex[q]))}});
 const gs=g=>avg(rows.filter(r=>r.g===g).map(r=>r.score));
 const sc={front:gs('front'),side:gs('side'),rot:gs('rot')};
 const W={front:.35,side:.4,rot:.25};let tw=0,ts=0;for(const g in W)if(sc[g]!=null){tw+=W[g];ts+=W[g]*sc[g]}
 sc.total=tw?ts/tw:null;for(const g in sc)if(sc[g]!=null)sc[g]=Math.round(sc[g]);
 const sv=q=>avg(['right','left'].filter(k=>SD[k]&&SD[k].m[q]!=null).map(k=>SD[k].m[q]));
 const so=q=>{const v=sv(q);return v==null?null:v-specOf(q).ofs};const type=postureType(so('headFwd'),so('trunkFwd'),so('pelvisFwd'),so('kneeFwd'),rows);

}
function qualityWarn(c,F,SD){const W=[];
 if(F&&c.views.front&&!['manual','ref'].includes(c.views.front.rollSrc)){const a=[F.m.headTilt,F.m.shoulderTilt,F.m.pelvisTilt,F.m.trunkLean];
  if(a.every(x=>x!=null)&&(a.every(x=>x>0)||a.every(x=>x<0))&&Math.min(...a.map(Math.abs))>=2){const m=a.map(Math.abs).sort((x,y)=>x-y),md=(m[1]+m[2])/2;

function patientForm(p){openModal('<h2>'+(p?'患者さん情報の編集':'新しい患者さん')+'</h2><form id="pform" class="form"><label>お名前<span class="req">必須</span><input name="name" required autocomplete="off" value="'+esc(p?p.name:'')+'"></label>'+
 '<label>ふりがな<input name="kana" autocomplete="off" value="'+esc(p?p.kana||'':'')+'"></label><label>身長（cm）<input name="height" inputmode="decimal" placeholder="例 165" value="'+(p&&p.height?p.height:'')+'"></label>'+
 '<label>体重（kg）<input name="weight" inputmode="decimal" placeholder="例 60" value="'+(p&&p.weight?p.weight:'')+'"></label><div class="row2"><label>性別<select name="sex">'+[['','未選択'],['f','女性'],['m','男性']].map(o=>'<option value="'+o[0]+'"'+(p&&p.sex===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label><label>年代<select name="age">'+['','10代以下','20代','30代','40代','50代','60代','70代','80代以上'].map(o=>'<option value="'+o+'"'+(p&&p.ageBand===o?' selected':'')+'>'+(o||'未選択')+'</option>').join('')+'</select></label></div><label>メモ<input name="memo" autocomplete="off" placeholder="例 腰痛・デスクワーク" value="'+esc(p?p.memo||'':'')+'"></label><div class="macts"><button class="btn pri" type="submit">保存</button><button class="btn" type="button" data-act="closeModal">キャンセル</button>'+(p?'<button class="btn danger" type="button" data-act="delPatient">この患者さんを削除</button>':'')+'</div></form>');
 $('#pform').onsubmit=async e=>{e.preventDefault();const sb=e.target.querySelector('[type=submit]');if(sb.disabled)return;const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;const h=parseFloat(fd.get('height'));sb.disabled=true;sb.textContent='保存中…';
  const body=Object.assign({kind:'patient',createdAt:new Date().toISOString(),count:0},p||{},{id:p?p.id:uid('p'),kind:'patient',name,kana:String(fd.get('kana')||'').trim(),height:h>80&&h<230?h:null,weight:(parseFloat(fd.get('weight'))>15&&parseFloat(fd.get('weight'))<250)?parseFloat(fd.get('weight')):null,memo:String(fd.get('memo')||'').trim(),sex:String(fd.get('sex')||''),ageBand:String(fd.get('age')||'')});
  try{await Store.savePatient(body)}catch(err){toast('保存できませんでした：'+msg(err));sb.disabled=false;sb.textContent='保存';return}
  upsertPatient(body);closeModal();st.patient=body;if(!p){st.sessions=[];go('patient')}else render()}}
function trialSaveModal(){openModal('<h2>どの患者さんの記録として保存しますか？</h2><form id="tform" class="form">'+(st.patients.length?'<label>登録済みの患者さん<select name="pid"><option value="">選んでください</option>'+st.patients.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select></label><p class="or">または</p>':'')+
 '<label>新しい患者さんのお名前<input name="name" autocomplete="off"></label><div class="macts"><button class="btn pri" type="submit">保存</button><button class="btn" type="button" data-act="closeModal">キャンセル</button></div></form>');
 $('#tform').onsubmit=async e=>{e.preventDefault();const sb=e.target.querySelector('[type=submit]');if(sb.disabled)return;const fd=new FormData(e.target),pid=fd.get('pid'),name=String(fd.get('name')||'').trim();let p=null;sb.disabled=true;
  try{if(pid){p=st.patients.find(x=>x.id===pid);st.sessions=await Store.listSessions(pid)}else if(name){p={id:uid('p'),kind:'patient',name,kana:'',height:st.cur.height||null,memo:'',createdAt:new Date().toISOString(),count:0};await Store.savePatient(p);upsertPatient(p);st.sessions=[]}else{sb.disabled=false;return}}
  catch(err){toast('保存できませんでした：'+msg(err));sb.disabled=false;return}
  st.patient=p;closeModal();await doSave()}}

/* ---------- events ---------- */
const ACT={
 home:async()=>{st.patient=null;go('home')},
 newPatient:()=>patientForm(null),
 editPatient:()=>patientForm(st.patient),
 openPatient:async b=>{const p=st.patients.find(x=>x.id===b.dataset.id);if(!p)return;st.patient=p;st.sessions=[];try{st.sessions=await Store.listSessions(p.id)}catch(e){toast(msg(e))}go('patient')},
 toPatient:()=>go('patient'),
 startCapture:()=>{st.cur=newCur(st.patient.height,st.patient.weight);st.tab='front';st.adjust=false;st.err={};go('capture');ensureEngine().catch(()=>{})},
 trial:()=>{st.patient={id:null,name:'お試し',height:null};st.sessions=[];ACT.startCapture()},
 tab:b=>{st.tab=b.dataset.k;st.adjust=false;st.ref=false;st.pick=false;render()},
 adjust:()=>{st.adjust=!st.adjust;st.ref=false;st.pick=false;render()},
 rollAuto:()=>{const v=st.cur.views[st.tab];if(!v||!v.rollEst||v.rollEst.roll==null)return;v.roll=v.rollEst.roll;v.rollSrc='auto';if(st.cur.saved)st.cur.dirty=true;render()},
 rollZero:()=>{const v=st.cur.views[st.tab];if(!v)return;v.roll=0;v.rollSrc='none';if(st.cur.saved)st.cur.dirty=true;render()},
 rollRef:()=>{st.ref=!st.ref;st.adjust=false;st.pick=false;st.tool.tilt=true;render()},
 pickMarker:()=>{st.pick=!st.pick;st.adjust=false;st.ref=false;st.tool.mk=true;render()},
 snapNow:()=>{const v=st.cur.views[st.tab];if(!v||!st.marker)return;const n=snapMarkers(v,st.tab,st.marker);if(st.cur.saved)st.cur.dirty=true;toast(n?n+'点の目印をシールに合わせました':'目印の近くにシールが見つかりませんでした');render()},
 toCapture:()=>{if(st.cur&&st.cur.fromHistory)return go('patient');go('capture')},
 toResult:()=>{st.cmpId=null;go('result')},
 openSession:b=>{const s=st.sessions.find(x=>x.id===b.dataset.id);if(!s)return;st.cur=unpack(s);st.cmpId=null;go('result')},
 delSession:b=>{const sid=b.dataset.id;confirmBox('この分析の記録を削除しますか？','削除する',async()=>{try{await Store.deleteSession(st.patient.id,sid);st.sessions=st.sessions.filter(x=>x.id!==sid);const L=st.sessions[0];const np=Object.assign({},st.patient,{lastAt:L?L.date:null,lastTotal:L&&L.scores?L.scores.total:null,count:st.sessions.length});await Store.savePatient(np);st.patient=np;upsertPatient(np);toast('削除しました')}catch(e){toast(msg(e))}render()})},
 delPatient:()=>{const p=st.patient;confirmBox(p.name+'さんと、すべての分析の記録を削除しますか？','削除する',async()=>{try{await Store.deletePatient(p.id);st.patients=st.patients.filter(x=>x.id!==p.id);st.patient=null;toast('削除しました');go('home')}catch(e){toast(msg(e))}})},
 cfOk:async()=>{const fn=st.cf;st.cf=null;closeModal();if(fn)await fn()},
 back:()=>goBack(),
 authMenu:()=>authMenu(),
 logout:()=>confirmBox('この端末からログアウトしますか？次に開くときは院コードとパスコードの入力が必要です。','ログアウト',async()=>{if(Store.mode==='cloud'){await CL.logout();st.patients=[];st.patient=null;st.lock={mode:'login'};go('lock');return}try{await gs('apiLogout',AUTH.token)}catch(e){}AUTH.save(null);lockOut()}),
 recDone:()=>{const c=$('#recOk');if(!c||!c.checked)return toast('「書き留めました」にチェックを入れてください');enterApp()},
 recLost:()=>confirmBox('復旧コードがない場合は、新しい暗号キーで始めます。これまでの患者さんのお名前・メモ・コメントは読めなくなります（測定の記録とグラフは残ります）。よろしいですか？','新しく始める',async()=>{st.lock={mode:'setup',discard:true};st.lockErr='';render()}),
 admin:()=>{st.adm={loading:true};go('admin');loadAdmin()},
 copyIssued:async()=>{const i=st.adm&&st.adm.issued;if(!i)return;try{await navigator.clipboard.writeText(issuedText(i));toast('案内文をコピーしました')}catch(e){toast('コピーできませんでした。画面の内容を写してください')}},
 admReset:b=>{const code=b.dataset.code,name=b.dataset.name;confirmBox('「'+name+'」のパスコードを再発行しますか？先方は新しい最初のパスコードでログインし、復旧コードを使ってお名前を読み戻します。','再発行する',async()=>{try{const r=await CL.adminCall({action:'reset',code});st.adm.issued={code:r.code,temp:r.temp,name,reset:true};render()}catch(e){toast(msg(e))}})},
 admDel:b=>{const code=b.dataset.code,name=b.dataset.name;confirmBox('「'+name+'」と、その院のすべての記録を削除しますか？元に戻せません。','削除する',async()=>{try{await CL.adminCall({action:'delete',code});toast('削除しました');loadAdmin()}catch(e){toast(msg(e))}})},
 importGas:()=>confirmBox('Googleドライブに保存されている記録（患者さんと分析の記録、判定基準）を、この院に取り込みます。お名前は暗号化して保存します。','取り込む',async()=>{go('home');await importGas()}),
 save:()=>doSave(),
 judge:b=>{const c=st.cur;if(!c)return;c.judge=c.judge||{};const k=b.dataset.k,v=b.dataset.v;if(c.judge[k]===v)delete c.judge[k];else c.judge[k]=v;syncJudge();markDirty()},
 judgeRest:()=>{const c=st.cur,A=st.A;if(!c||!A)return;c.judge=c.judge||{};let n=0;A.rows.forEach(r=>{const k=jkey(r);if(!c.judge[k]){c.judge[k]=r.st;n++}});syncJudge();if(n)markDirty();toast(n?n+'項目をアプリの判定どおりにしました':'すべて判定済みです')},
 calib:()=>{st.cal=null;go('calib');loadCalib()},
 calReload:()=>loadCalib(),
 calApply:b=>{const k=b.dataset.k,q=JSON.parse(b.dataset.q);CFG[k]={ofs:q.ofs,good:q.good,bad:q.bad};st.cal.dirty=true;render()},
 calReset:b=>{delete CFG[b.dataset.k];st.cal.dirty=true;render()},
 calSave:async()=>{const b=$('#cfgSave');if(b){b.disabled=true;b.textContent='保存中…'}try{await saveCfg();st.cal.dirty=false;toast('判定基準を保存しました')}catch(e){toast('保存できませんでした：'+msg(e))}render()},
 saveTrial:()=>trialSaveModal(),
 report:()=>openReport(),
 rep:b=>{st.repPhoto=b.dataset.p==='1';openReport()},
 shareReport:async()=>{if(!st.report)return;const blob=await new Promise(r=>st.report.toBlob(r,'image/jpeg',0.92));const file=new File([blob],repName(),{type:'image/jpeg'});
  try{if(navigator.canShare&&!navigator.canShare({files:[file]}))throw new Error('x');await navigator.share({files:[file],title:'姿勢分析レポート'})}catch(e){if(!(e&&e.name==='AbortError'))toast('この画面からは共有できませんでした。画像を長押しして保存してください')}},
 driveReport:async b=>{if(!st.report)return;b.disabled=true;b.textContent='保存中…';const b64=st.report.toDataURL('image/jpeg',0.92).split(',')[1];
  try{const url=await gs('apiSaveReport',repName(),b64);const h=$('#repHint');if(h)h.innerHTML='Googleドライブの「ほさか整骨院_姿勢分析レポート」フォルダに保存しました。<a href="'+esc(url)+'" target="_blank" rel="noopener">開く</a>';b.textContent='保存しました ✓'}catch(e){toast('保存できませんでした：'+msg(e));b.disabled=false;b.textContent='Googleドライブに保存'}},
 copyLine:async()=>{const t=lineText();try{await navigator.clipboard.writeText(t);toast('LINE用の文章をコピーしました')}catch(e){const ta=$('#lineTxt');if(ta){ta.className='';ta.value=t;ta.rows=8;ta.removeAttribute('tabindex');ta.focus();ta.select()}toast('文章を選択しました。コピーしてお使いください')}},
 closeModal:()=>closeModal()
};
document.addEventListener('click',e=>{const m=$('#modal');if(e.target===m){closeModal();return}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const fn=ACT[b.dataset.act];if(fn){e.preventDefault();Promise.resolve(fn(b,e)).catch(err=>toast(msg(err)))}});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='newClinic'){e.preventDefault();const n=(($('#ncName')||{}).value||'').trim();if(!n)return;const b=e.target.querySelector('[type=submit]');b.disabled=true;b.textContent='発行中…';CL.adminCall({action:'create',name:n}).then(r=>{st.adm.issued=r;loadAdmin()}).catch(er=>{toast(msg(er));b.disabled=false;b.textContent='追加して院コードを発行'});return}
 if(e.target&&e.target.id==='lockForm'){e.preventDefault();if(Store.mode==='cloud')submitLockCloud();else submitLock()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='calAll'){st.calAll=t.checked;loadCalib()}
 if(t.id==='demoShare'){st.demoShare=t.checked}
 if(t.dataset&&t.dataset.cfg&&st.cal){const k=t.dataset.cfg,f=t.dataset.f,v=parseFloat(t.value),q=specOf(k);if(isFinite(v)){const o=CFG[k]=Object.assign({ofs:q.ofs,good:q.good,bad:q.bad},CFG[k]||{});o[f]=f==='ofs'?v:Math.max(0.5,v);if(o.bad<=o.good)o.bad=o.good+0.5;const s=SPEC[k];if(!o.ofs&&o.good===s.good&&o.bad===s.bad)delete CFG[k];st.cal.dirty=true;
  setTimeout(()=>{const el=document.querySelector('.cal .card[data-ck="'+k+'"] .cst');if(el&&st.cal.S)el.innerHTML=calStat(st.cal.S[k],specOf(k));const b=$('#cfgSave');if(b){b.disabled=false;b.textContent='基準を保存'}},0)}}if(t.id==='file'){const f=t.files&&t.files[0];const k=st.tab;t.value='';if(f)handlePhoto(k,f)}
 if(t.id==='cmpSel'){st.cmpId=t.value;render()}
 if(t.id==='autoSnap'){st.autoSnap=t.checked;saveMarker()}
 if(t.dataset&&t.dataset.care&&st.cur){st.cur.care={ex:$$('input[data-care=ex]:checked').map(i=>i.value),life:$$('input[data-care=life]:checked').map(i=>i.value)};if(st.cur.saved){st.cur.dirty=true;const b=$('#saveBtn');if(b){b.disabled=false;b.textContent='変更を保存'}}}
 if(t.id==='rollR'){render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){st.q=t.value;renderList()}
 if(t.id==='comment'&&st.cur){st.cur.comment=t.value;if(st.cur.saved&&!st.cur.dirty){st.cur.dirty=true;const b=$('#saveBtn');if(b){b.disabled=false;b.textContent='変更を保存'}}}
 if(t.id==='height'&&st.cur){const h=parseFloat(t.value);st.cur.height=h>80&&h<230?h:null;renderQuick()}
 if(t.id==='weight'&&st.cur){const w=parseFloat(t.value);st.cur.weight=w>15&&w<250?w:null}
 if(t.id==='rollR'&&st.cur){const v=st.cur.views[st.tab];if(!v)return;v.roll=parseFloat(t.value)||0;v.rollSrc='manual';if(st.cur.saved)st.cur.dirty=true;const l=$('#rollV');if(l)l.textContent=(v.roll>0?'+':'')+f1(v.roll)+'°';setupEditor()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details.tool'))st.tool[d.dataset.t]=d.open},true);
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(st.view==='capture')setupEditor();if(st.view==='result')afterResult()},200)});
window.__app={st,analyze,ACT,Store,makeReport,lineText,estimateRoll,detectRobust,snapMarkers,loadImg,getCfg:()=>CFG,setCfg:c=>{CFG=c},calFit,calSamples,specOf,CL,CRY,getProfile:()=>PROFILE};
(async()=>{try{if(!isDemo())applyTheme(localStorage.getItem('shisei-theme')||'',false)}catch(e){}NAV.init();render();await Store.init();
 if(Store.mode==='cloud'){try{const prm=await urlParams();let last='';try{last=localStorage.getItem('shisei-last-code')||''}catch(e){}st.lockCode=String(prm.clinic||last||'').toLowerCase();if(prm.clinic&&({fukufuku:'orange'})[st.lockCode])applyTheme(({fukufuku:'orange'})[st.lockCode],false);
  const c=await CL.me();if(!c||c.must_change||!CL.dekRaw){PROFILE={name:c?c.name:'',tagline:''};updBrand()}if(!c){st.lock={mode:'login'};st.loading=false;go('lock');return}await CL.loadLocalDek();
  if(c.must_change){st.lock={mode:'setup'};st.loading=false;go('lock');return}if(!CL.dek){st.lock={mode:'unlock'};st.loading=false;go('lock');return}applyClinic()}catch(e){st.loadErr=msg(e)}}
 if(Store.mode==='gas'){try{const a=await gs('apiAuthStatus',AUTH.token);if(!a||!a.ok){st.lock={set:!!(a&&a.set)};st.loading=false;go('lock');return}}catch(e){st.loadErr=msg(e)}}
 await loadPatients()})();
}
